<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#E8940A" />
    <title>타슈+ | 대전 공영자전거 확장 서비스</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <!--
      카카오맵 JS SDK. autoload=false 로 받아두고 kakao.maps.load() 를 코드에서 직접 호출한다
      (src/lib/useKakaoLoader.ts). VITE_KAKAO_JS_KEY 가 없으면 이 요청이 실패하고,
      앱은 MapFallback(CSS placeholder)으로 자동 전환된다.
      services=clusterer 없이 기본 로드만 사용한다.
    -->
    <script
      src="//dapi.kakao.com/v2/maps/sdk.js?appkey=%VITE_KAKAO_JS_KEY%&autoload=false"
      onerror="window.__kakaoSdkFailed = true"
    ></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
